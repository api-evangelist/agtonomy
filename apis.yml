aid: agtonomy
name: Agtonomy
description: 'Agtonomy is a physical-AI and automation software company, founded in 2021 by growers
  and technologists, that embeds machine vision, connectivity, and AI directly into agricultural and
  off-road equipment from manufacturers such as Bobcat, Kubota, and Clemens. Its platform combines GPS
  guidance, computer vision, and fleet intelligence so a single operator can plan, remotely monitor, and
  review autonomous tasks like mowing, hauling, spraying, and cultivation across 10+ tractors at once. The
  TeleFarmer product controls these field missions through an intuitive app, helping growers address labor
  shortages and rising operational costs. Backed by investors including GV and Allison Transmission,
  Agtonomy operates primarily across the western United States with expansion into the Southeast US and
  Australia. This profile was surfaced as a GV portfolio company and enriched by the API Evangelist
  pipeline; Agtonomy publishes no public developer API surface at this time.'
